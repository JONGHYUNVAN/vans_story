<svg xmlns="http://www.w3.org/2000/svg" width="900" height="580" viewBox="0 0 900 580" font-family="system-ui, -apple-system, sans-serif">
  <!-- Background -->
  <rect width="900" height="580" fill="#18181b"/>

  <!-- Title -->
  <text x="450" y="38" text-anchor="middle" fill="#f4f4f5" font-size="18" font-weight="700" letter-spacing="0.5">실시간 주식 대시보드 — 아키텍처</text>

  <!-- ═══════════════════════════════════════════════════════ -->
  <!-- PIPELINE 1: KR Real-Time -->
  <!-- ═══════════════════════════════════════════════════════ -->
  <rect x="20" y="60" width="860" height="230" rx="10" fill="#27272a" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="36" y="84" fill="#a78bfa" font-size="13" font-weight="700" letter-spacing="0.3">국내주식 실시간 파이프라인</text>

  <!-- Box 1: KIS WebSocket API -->
  <rect x="36" y="96" width="140" height="62" rx="7" fill="#18181b" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="106" y="120" text-anchor="middle" fill="#a78bfa" font-size="12" font-weight="600">KIS WebSocket API</text>
  <text x="106" y="138" text-anchor="middle" fill="#71717a" font-size="11">wss:// (TR_ID_TRADE</text>
  <text x="106" y="151" text-anchor="middle" fill="#71717a" font-size="11">/ TR_ID_ORDERBOOK)</text>

  <!-- Arrow 1→2 -->
  <line x1="176" y1="127" x2="215" y2="127" stroke="#7c3aed" stroke-width="1.5" marker-end="url(#arr-violet)"/>
  <text x="196" y="120" text-anchor="middle" fill="#a78bfa" font-size="10">WebSocket</text>
  <text x="196" y="142" text-anchor="middle" fill="#71717a" font-size="10">pipe |</text>

  <!-- Box 2: KisWebSocketManager -->
  <rect x="215" y="88" width="160" height="78" rx="7" fill="#18181b" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="295" y="110" text-anchor="middle" fill="#a78bfa" font-size="12" font-weight="600">KisWebSocketManager</text>
  <text x="295" y="127" text-anchor="middle" fill="#71717a" font-size="10">_on_message()</text>
  <text x="295" y="141" text-anchor="middle" fill="#71717a" font-size="10">AES-256-CBC 복호화</text>
  <text x="295" y="155" text-anchor="middle" fill="#71717a" font-size="10">_notify_listeners()</text>

  <!-- Arrow 2→3 -->
  <line x1="375" y1="127" x2="412" y2="127" stroke="#7c3aed" stroke-width="1.5" marker-end="url(#arr-violet)"/>
  <text x="394" y="120" text-anchor="middle" fill="#71717a" font-size="10">queue.Queue</text>
  <text x="394" y="141" text-anchor="middle" fill="#71717a" font-size="10">listener()</text>

  <!-- Box 3: Django stream() view -->
  <rect x="412" y="88" width="160" height="78" rx="7" fill="#18181b" stroke="#10b981" stroke-width="1.5"/>
  <text x="492" y="110" text-anchor="middle" fill="#34d399" font-size="12" font-weight="600">Django stream() view</text>
  <text x="492" y="127" text-anchor="middle" fill="#71717a" font-size="10">StreamingHttpResponse</text>
  <text x="492" y="141" text-anchor="middle" fill="#71717a" font-size="10">content_type=</text>
  <text x="492" y="155" text-anchor="middle" fill="#71717a" font-size="10">text/event-stream</text>

  <!-- Arrow 3→4 -->
  <line x1="572" y1="127" x2="608" y2="127" stroke="#10b981" stroke-width="1.5" marker-end="url(#arr-emerald)"/>
  <text x="590" y="120" text-anchor="middle" fill="#34d399" font-size="10">SSE fetch</text>
  <text x="590" y="141" text-anchor="middle" fill="#71717a" font-size="10">중계</text>

  <!-- Box 4: Next.js Edge BFF route -->
  <rect x="608" y="88" width="165" height="78" rx="7" fill="#18181b" stroke="#0ea5e9" stroke-width="1.5"/>
  <text x="690" y="107" text-anchor="middle" fill="#38bdf8" font-size="11" font-weight="600">Next.js Edge BFF</text>
  <text x="690" y="122" text-anchor="middle" fill="#71717a" font-size="10">/api/stocks/kis/stream</text>
  <text x="690" y="136" text-anchor="middle" fill="#71717a" font-size="10">/[symbol]/route.ts</text>
  <text x="690" y="150" text-anchor="middle" fill="#71717a" font-size="10">runtime: edge</text>
  <text x="690" y="164" text-anchor="middle" fill="#71717a" font-size="10">스트림 본문 그대로 중계</text>

  <!-- Arrow 4→5 -->
  <line x1="773" y1="127" x2="808" y2="127" stroke="#0ea5e9" stroke-width="1.5" marker-end="url(#arr-sky)"/>
  <text x="791" y="120" text-anchor="middle" fill="#38bdf8" font-size="10">SSE</text>

  <!-- Box 5: useKisRealtime hook -->
  <rect x="808" y="88" width="68" height="78" rx="7" fill="#18181b" stroke="#0ea5e9" stroke-width="1.5"/>
  <text x="842" y="110" text-anchor="middle" fill="#38bdf8" font-size="10" font-weight="600">useKis</text>
  <text x="842" y="124" text-anchor="middle" fill="#38bdf8" font-size="10" font-weight="600">Realtime</text>
  <text x="842" y="139" text-anchor="middle" fill="#71717a" font-size="9">EventSource</text>
  <text x="842" y="152" text-anchor="middle" fill="#71717a" font-size="9">체결가 /</text>
  <text x="842" y="165" text-anchor="middle" fill="#71717a" font-size="9">호가</text>

  <!-- Ping note -->
  <rect x="36" y="182" width="840" height="28" rx="5" fill="#1c1917" stroke="#44403c" stroke-width="1"/>
  <text x="456" y="200" text-anchor="middle" fill="#78716c" font-size="11">Django stream(): 15초마다 핑 전송으로 연결 유지 · useKisRealtime: 지수 백오프로 최대 5회 재연결</text>

  <!-- Snapshot fallback note -->
  <rect x="36" y="216" width="840" height="26" rx="5" fill="#1c1917" stroke="#44403c" stroke-width="1"/>
  <text x="456" y="233" text-anchor="middle" fill="#78716c" font-size="11">초기 폴백: useKisRealtime이 KisWebSocketManager.get_snapshot()을 통해 GET /api/kis/snapshot/&lt;symbol&gt;/ (REST) 요청</text>

  <!-- ═══════════════════════════════════════════════════════ -->
  <!-- PIPELINE 2: US / Heatmap Polling -->
  <!-- ═══════════════════════════════════════════════════════ -->
  <rect x="20" y="310" width="860" height="200" rx="10" fill="#27272a" stroke="#0ea5e9" stroke-width="1.5"/>
  <text x="36" y="334" fill="#38bdf8" font-size="13" font-weight="700" letter-spacing="0.3">미국주식 / 히트맵 폴링 파이프라인</text>

  <!-- Box A: Yahoo Finance -->
  <rect x="36" y="348" width="148" height="62" rx="7" fill="#18181b" stroke="#71717a" stroke-width="1.5"/>
  <text x="110" y="372" text-anchor="middle" fill="#d4d4d8" font-size="12" font-weight="600">Yahoo Finance</text>
  <text x="110" y="389" text-anchor="middle" fill="#71717a" font-size="10">v8/finance/chart/</text>
  <text x="110" y="403" text-anchor="middle" fill="#71717a" font-size="10">{symbol}?interval=1d</text>

  <!-- Arrow A→B -->
  <line x1="184" y1="379" x2="230" y2="379" stroke="#71717a" stroke-width="1.5" marker-end="url(#arr-zinc)"/>
  <text x="207" y="371" text-anchor="middle" fill="#71717a" font-size="10">HTTPS GET</text>
  <text x="207" y="394" text-anchor="middle" fill="#71717a" font-size="10">캐시 없음</text>

  <!-- Box B: Next.js BFF prices route -->
  <rect x="230" y="342" width="180" height="74" rx="7" fill="#18181b" stroke="#0ea5e9" stroke-width="1.5"/>
  <text x="320" y="362" text-anchor="middle" fill="#38bdf8" font-size="12" font-weight="600">Next.js BFF</text>
  <text x="320" y="378" text-anchor="middle" fill="#71717a" font-size="10">/api/stocks/prices/route.ts</text>
  <text x="320" y="393" text-anchor="middle" fill="#71717a" font-size="10">fetchV8ChartAll()</text>
  <text x="320" y="407" text-anchor="middle" fill="#71717a" font-size="10">normalizeFromV8Chart()</text>

  <!-- Arrow B→C -->
  <line x1="410" y1="379" x2="455" y2="379" stroke="#0ea5e9" stroke-width="1.5" marker-end="url(#arr-sky)"/>
  <text x="433" y="371" text-anchor="middle" fill="#38bdf8" font-size="10">JSON</text>
  <text x="433" y="394" text-anchor="middle" fill="#71717a" font-size="10">NextResponse 응답</text>

  <!-- Box C: useUsRealtime hook -->
  <rect x="455" y="342" width="175" height="74" rx="7" fill="#18181b" stroke="#0ea5e9" stroke-width="1.5"/>
  <text x="542" y="362" text-anchor="middle" fill="#38bdf8" font-size="12" font-weight="600">useUsRealtime hook</text>
  <text x="542" y="378" text-anchor="middle" fill="#71717a" font-size="10">fetchQuote() via fetch()</text>
  <text x="542" y="393" text-anchor="middle" fill="#71717a" font-size="10">30초 주기 setInterval</text>
  <text x="542" y="407" text-anchor="middle" fill="#71717a" font-size="10">(POLL_INTERVAL_MS = 30_000)</text>

  <!-- Arrow C→D -->
  <line x1="630" y1="379" x2="670" y2="379" stroke="#0ea5e9" stroke-width="1.5" marker-end="url(#arr-sky)"/>
  <text x="650" y="371" text-anchor="middle" fill="#38bdf8" font-size="10">상태</text>
  <text x="650" y="394" text-anchor="middle" fill="#71717a" font-size="10">업데이트</text>

  <!-- Box D: React UI -->
  <rect x="670" y="348" width="160" height="62" rx="7" fill="#18181b" stroke="#10b981" stroke-width="1.5"/>
  <text x="750" y="372" text-anchor="middle" fill="#34d399" font-size="12" font-weight="600">React UI</text>
  <text x="750" y="389" text-anchor="middle" fill="#71717a" font-size="10">MarketHoursSection</text>
  <text x="750" y="403" text-anchor="middle" fill="#71717a" font-size="10">히트맵 / 워치리스트</text>

  <!-- Polling stop note -->
  <rect x="36" y="432" width="840" height="28" rx="5" fill="#1c1917" stroke="#44403c" stroke-width="1"/>
  <text x="456" y="450" text-anchor="middle" fill="#78716c" font-size="11">marketState === 'CLOSED' 시 폴링 중단 · 활성 상태: PRE · REGULAR · POST · POSTPOST</text>

  <!-- Also polls /api/stocks/prices for heatmap -->
  <rect x="36" y="466" width="840" height="28" rx="5" fill="#1c1917" stroke="#44403c" stroke-width="1"/>
  <text x="456" y="484" text-anchor="middle" fill="#78716c" font-size="11">/api/stocks/prices는 워치리스트·히트맵용 KR + US 배치 데이터도 제공 (GET ?market=kr|us|all)</text>

  <!-- ═══════════════════════════════════════════════════════ -->
  <!-- Legend -->
  <!-- ═══════════════════════════════════════════════════════ -->
  <rect x="20" y="524" width="860" height="44" rx="8" fill="#27272a" stroke="#3f3f46" stroke-width="1"/>
  <line x1="48" y1="546" x2="80" y2="546" stroke="#7c3aed" stroke-width="2"/>
  <text x="86" y="550" fill="#a78bfa" font-size="12">KIS/Django layer</text>
  <line x1="210" y1="546" x2="242" y2="546" stroke="#10b981" stroke-width="2"/>
  <text x="248" y="550" fill="#34d399" font-size="12">SSE / 스트리밍</text>
  <line x1="380" y1="546" x2="412" y2="546" stroke="#0ea5e9" stroke-width="2"/>
  <text x="418" y="550" fill="#38bdf8" font-size="12">Next.js BFF / hook</text>
  <line x1="570" y1="546" x2="602" y2="546" stroke="#71717a" stroke-width="2"/>
  <text x="608" y="550" fill="#a1a1aa" font-size="12">외부 API</text>
  <text x="718" y="550" fill="#52525b" font-size="11">Django: StreamingHttpResponse · SSE 핑 15초</text>

  <!-- Arrowhead markers -->
  <defs>
    <marker id="arr-violet" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#7c3aed"/>
    </marker>
    <marker id="arr-emerald" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#10b981"/>
    </marker>
    <marker id="arr-sky" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#0ea5e9"/>
    </marker>
    <marker id="arr-zinc" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#71717a"/>
    </marker>
  </defs>
</svg>
